<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSF Leak IL | פורום וקהילה</title>
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="stylesheet" href="../CSS/style.css" />
</head>

<body>
    <header class="topbar">
        <div class="topbar-brand">CSF Leak IL — קהילה</div>
        <nav class="topbar-nav">
            <a href="index.html">פורום</a>
            <a href="profile.html">אזור אישי</a>
        </nav>
    </header>

    <main class="page-wrap">
        <div class="page-header">
            <h1>דיוני הקהילה</h1>
            <button type="button" id="toggle-post-form" class="btn">+ פתיחת דיון חדש</button>
        </div>

        <section id="new-post-box" class="card" style="display: none;">
            <h2 class="post-title" style="margin-top: 0;">דיון חדש</h2>
            <form id="create-post-form">
                <div class="form-field">
                    <label for="author-name">כינוי</label>
                    <input type="text" id="author-name" placeholder="למשל: אורח / כינוי" required />
                </div>

                <div class="form-field">
                    <label for="post-category">נושא</label>
                    <select id="post-category">
                        <option value="אבחון ובדיקות">אבחון ובדיקות</option>
                        <option value="טיפולים">טיפולים</option>
                        <option value="התמודדות יומיומית">התמודדות יומיומית</option>
                        <option value="רופאים ומרכזים">רופאים ומרכזים</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="post-title">כותרת</label>
                    <input type="text" id="post-title" placeholder="כותרת הדיון" required />
                </div>

                <div class="form-field">
                    <label for="post-body">תוכן</label>
                    <textarea id="post-body" rows="4" placeholder="כתבי כאן את ההודעה..." required></textarea>
                </div>

                <button type="submit" class="btn">פרסום</button>
                <div id="post-status" class="status-msg"></div>
            </form>
        </section>

        <div class="filter-bar">
            <label for="category-filter" style="display: none;">סינון לפי נושא</label>
            <select id="category-filter">
                <option value="ALL">כל הנושאים</option>
                <option value="אבחון ובדיקות">אבחון ובדיקות</option>
                <option value="טיפולים">טיפולים</option>
                <option value="התמודדות יומיומית">התמודדות יומיומית</option>
                <option value="רופאים ומרכזים">רופאים ומרכזים</option>
            </select>
        </div>

        <div id="posts-list">
            <div class="card">טוען דיונים...</div>
        </div>
    </main>

    <script type="module" src="../JS/forum.js"></script>
    <script type="module" src="../JS/navbar.js"></script>
</body>

</html>
