<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta name="google-site-verification" content="google8c739a2b46051f97" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSF Leak IL • צור קשר</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-current-page="contact">

    <!-- רכיב Header, תפריט ניווט ונגישות משותף (נטען אוטומטית מ-header.html / script.js) -->
    <div id="site-header-placeholder"></div>

    <!-- אזור תוכן מרכזי דינמי (נטען מהדף הראשי של הבית ללא רענון דפדפן) -->
    <main id="page-content" class="main-wrapper">
<section class="page-banner">
    <div class="container">
        <span class="banner-kicker">פנייה ישירה ומאובטחת</span>
        <h1 class="banner-title">יצירת קשר עם מובילי הקהילה</h1>
        <p class="banner-desc">
            צריכים עזרה באיתור מומחה? רוצים להתייעץ בדיסקרטיות? הצוות שלנו כאן עבורכם בהתנדבות מלאה.
        </p>
    </div>
</section>

<section class="section-block">
    <div class="container grid-asymmetric">
        <div class="card">
            <form id="mainContactForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="contactName">שם מלא *</label>
                        <input type="text" id="contactName" required placeholder="ישראל ישראלי" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contactPhone">מספר טלפון וואטסאפ *</label>
                        <input type="tel" id="contactPhone" required placeholder="050-0000000" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="contactMsg">במה נוכל לסייע לך? *</label>
                    <textarea id="contactMsg" rows="4" required placeholder="תארו בקצרה את מצבכם..." class="form-control"></textarea>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    <span>שליחת הפנייה לצוות CSF Leak IL</span>
                </button>
            </form>
        </div>

        <div class="card-subtle stack-sm">
            <h3>פנייה ישירה בדוא"ל</h3>
            <div class="callout-box callout-slate">
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                <strong>דוא"ל רשמי:</strong>
                <div>contact@csfleakisrael.org.il</div>
            </div>
        </div>
    </div>
</section>

    </main>

    <!-- רכיב הבהרה משפטית ו-Footer משותף (נטען אוטומטית מ-footer.html / script.js) -->
    <div id="site-footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
